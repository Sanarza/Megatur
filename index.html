<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEGATUR</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: url('https://images.unsplash.com/photo-1501785888041-af3ef285b470') no-repeat center center/cover;
}

header {
    text-align: center;
    padding: 40px 20px;
}

h1 {
    font-size: 55px;
    color: #0a4fa3;
}

h2 {
    font-size: 18px;
    background: rgba(255,255,255,0.9);
    padding: 6px 12px;
    border-radius: 6px;
}

.container {
    max-width: 750px;
    margin: auto;
    padding: 20px;
}

.form-box {
    background: rgba(255,255,255,0.95);
    padding: 25px;
    border-radius: 12px;
}

input, select, textarea {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
}

button {
    background: #0a4fa3;
    color: white;
    padding: 15px;
    border: none;
    width: 100%;
}

.hidden { display:none; }

#mensajeFinal {
    display:none;
    text-align:center;
}
</style>
</head>

<body>

<header>
<h1>MEGATUR</h1>
<h2>Traslados y Turismo Nacional e Internacional</h2>
</header>

<div class="container">
<div class="form-box">

<form id="form">

<input id="nombre" placeholder="Nombre" required>
<input id="telefono" placeholder="Teléfono" required>
<input id="adultos" placeholder="Adultos" required>
<input id="cantMenores" placeholder="Menores">

<input id="origen" placeholder="Origen">
<input id="ciudad" placeholder="Destino">

<input type="date" id="ida" required>

<select id="internos">
<option>No</option>
<option>Sí</option>
</select>

<textarea id="textoInternos"></textarea>

<select id="esperas">
<option>No</option>
<option>Sí</option>
</select>

<input id="horasEspera">

<button type="submit">Solicitar Presupuesto</button>

</form>

<div id="mensajeFinal">
<button>
GRACIAS POR TU CONSULTA
</button>
</div>

</div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBMlVhTdlsJ6Idf2dmdYWi7aojkpEuGPxg",
  authDomain: "megatur-633bf.firebaseapp.com",
  projectId: "megatur-633bf"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

form.addEventListener("submit", function(e){
    e.preventDefault();

    let data = {
        nombre: nombre.value,
        telefono: telefono.value,
        adultos: adultos.value,
        menores: cantMenores.value || 0,
        origen: origen.value,
        ciudad: ciudad.value,
        fecha: ida.value,
        traslados_internos: internos.value==="Sí"?textoInternos.value:"No incluye",
        esperas: esperas.value==="Sí"?horasEspera.value+" horas":"No incluye",
        estado:"pendiente",
        fecha_creacion:new Date()
    };

    db.collection("consultas").add(data)
    .then(()=>{

        /* EMAIL */
        let cuerpo = `
NUEVA CONSULTA MEGATUR

Nombre: ${data.nombre}
Teléfono: ${data.telefono}
Origen: ${data.origen}
Destino: ${data.ciudad}
Fecha: ${data.fecha}

Adultos: ${data.adultos}
Menores: ${data.menores}

Internos: ${data.traslados_internos}
Esperas: ${data.esperas}

------------------------------
ENVIAR PRESUPUESTO:
https://TU-ADMIN.github.io/admin.html
`;

        let mail = `mailto:sandracap08@hotmail.com?subject=NUEVA CONSULTA MEGATUR&body=${encodeURIComponent(cuerpo)}`;

        window.location.href = mail;

        form.style.display="none";
        mensajeFinal.style.display="block";

    });
});
</script>

</body>
</html>
