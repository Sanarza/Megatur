<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEGATUR</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: url('https://images.unsplash.com/photo-1501785888041-af3ef285b470') no-repeat center center/cover;
}

header {
    text-align: center;
    padding: 40px 20px;
}

h1 {
    font-size: 55px;
    color: #0a4fa3;
    text-shadow: 0 2px 0 #083a78, 0 6px 12px rgba(0,0,0,0.4), 0 0 25px rgba(10,79,163,0.6);
}

h2 {
    font-size: 18px;
    background: rgba(255,255,255,0.9);
    display: inline-block;
    padding: 6px 12px;
    border-radius: 6px;
}

.container {
    max-width: 750px;
    margin: auto;
    padding: 20px;
}

.form-box {
    background: rgba(255,255,255,0.95);
    padding: 25px;
    border-radius: 12px;
}

input, select, textarea {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    border-radius: 6px;
    border: 1px solid #ccc;
}

.row {
    display: flex;
    gap: 10px;
}

button {
    background: linear-gradient(145deg, #0a4fa3, #083a78);
    color: white;
    padding: 15px;
    border: none;
    width: 100%;
    font-size: 18px;
    border-radius: 8px;
    cursor: pointer;
    box-shadow: 0 6px #062c5c, 0 10px 20px rgba(0,0,0,0.3);
}

button:active {
    transform: translateY(4px);
    box-shadow: 0 2px #062c5c;
}

.hidden {
    display: none;
}

#mensajeFinal {
    display: none;
    text-align: center;
    margin-top: 20px;
}

#mensajeFinal button {
    background: white;
    color: #0a4fa3;
    border: 2px solid #0a4fa3;
}
</style>
</head>

<body>

<header>
    <h1>MEGATUR</h1>
    <h2>Traslados y Turismo Nacional e Internacional</h2>
</header>

<div class="container">
<div class="form-box">

<form id="form">

<div id="paso1">

<h3>Datos de Pasajeros</h3>

<input type="text" id="nombre" placeholder="Nombre" required>

<div class="row">
<span style="padding:12px;background:#eee;border-radius:6px;">+549</span>
<input type="tel" id="telefono" placeholder="Número sin 0 ni 15" required>
</div>

<label>Adultos</label>
<input type="number" id="adultos" required>

<label>¿Menores?</label>
<select id="menores" onchange="toggleMenores(this)">
<option>No</option>
<option>Sí</option>
</select>

<div id="menoresBox" class="hidden">
<input type="number" id="cantMenores" placeholder="Cantidad de menores">
</div>

<label>Equipaje</label>
<select id="equipaje">
<option>Mochila de mano</option>
<option>Valija 20kg</option>
<option>Sin equipaje</option>
</select>

<button type="button" onclick="siguiente()">Continuar</button>

</div>

<div id="paso2" class="hidden">

<h3>Destino del viaje</h3>

<label>Salida desde (Misiones)</label>
<input type="text" id="origen" required>

<input type="text" placeholder="Dirección exacta (opcional)">

<label>Destino</label>

<select id="pais" onchange="manejarPais()" required>
<option value="">País</option>
<option value="Argentina">Argentina</option>
<option value="Brasil">Brasil</option>
<option value="Uruguay">Uruguay</option>
<option value="Paraguay">Paraguay</option>
</select>

<div id="argentinaBox" class="row hidden">
<select id="provincia" onchange="cargarCiudades()"></select>
<select id="ciudad"></select>
</div>

<div id="exteriorBox" class="hidden">
<input type="text" id="provExt" placeholder="Provincia / Estado (obligatorio)">
<input type="text" id="ciudadExt" placeholder="Ciudad / Municipio (obligatorio)">
</div>

<label>Fecha ida</label>
<input type="date" id="ida" required>

<label>Hora salida</label>
<input type="time" id="salida" required>

<label>Fecha regreso</label>
<input type="date">

<label>Hora llegada</label>
<input type="time">

<label>¿Incluye traslados internos?</label>
<select id="internos" onchange="toggleInternos(this)">
<option>No</option>
<option>Sí</option>
</select>

<div id="detalleInternos" class="hidden">
<textarea id="textoInternos"></textarea>
</div>

<label>¿Incluye esperas?</label>
<select id="esperas" onchange="toggleEspera(this)">
<option>No</option>
<option>Sí</option>
</select>

<div id="esperaHoras" class="hidden">
<input type="number" id="horasEspera">
</div>

<label>
<input type="checkbox" required>
Los menores ocupan y abonan su lugar
</label>

<button type="submit">Solicitar Presupuesto</button>

</div>

</form>

<div id="mensajeFinal">
<button>
GRACIAS POR TU CONSULTA. En menos de 24hs. nos comunicaremos al whatsapp que proporcionaste, para enviarte el presupuesto de viaje.
</button>
</div>

</div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBMlVhTdlsJ6Idf2dmdYWi7aojkpEuGPxg",
  authDomain: "megatur-633bf.firebaseapp.com",
  projectId: "megatur-633bf",
  storageBucket: "megatur-633bf.firebasestorage.app",
  messagingSenderId: "651078263132",
  appId: "1:651078263132:web:e52380415a19413e812199"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

function siguiente(){ paso1.classList.add("hidden"); paso2.classList.remove("hidden"); }
function toggleMenores(e){ menoresBox.classList.toggle("hidden", e.value !== "Sí"); }
function toggleEspera(e){ esperaHoras.classList.toggle("hidden", e.value !== "Sí"); }
function toggleInternos(e){ detalleInternos.classList.toggle("hidden", e.value !== "Sí"); }

function manejarPais(){
    argentinaBox.classList.add("hidden");
    exteriorBox.classList.add("hidden");

    if(pais.value === "Argentina"){
        argentinaBox.classList.remove("hidden");
        cargarProvincias();
    } else {
        exteriorBox.classList.remove("hidden");
    }
}

async function cargarProvincias(){
    let res = await fetch("https://apis.datos.gob.ar/georef/api/provincias");
    let data = await res.json();

    provincia.innerHTML = "";
    data.provincias.forEach(p=>{
        let opt = document.createElement("option");
        opt.value = p.nombre;
        opt.text = p.nombre;
        provincia.appendChild(opt);
    });

    cargarCiudades();
}

async function cargarCiudades(){
    let res = await fetch(`https://apis.datos.gob.ar/georef/api/localidades?provincia=${provincia.value}&max=1000`);
    let data = await res.json();

    ciudad.innerHTML = "";
    data.localidades.forEach(c=>{
        let opt = document.createElement("option");
        opt.text = c.nombre;
        ciudad.appendChild(opt);
    });
}

form.addEventListener("submit", function(e){
    e.preventDefault();

    let paisVal = pais.value;

    if(paisVal !== "Argentina"){
        if(!provExt.value || !ciudadExt.value){
            alert("Completá provincia y ciudad");
            return;
        }
    }

    if(internos.value === "Sí" && !textoInternos.value){
        alert("Completá traslados internos");
        return;
    }

    let data = {
        nombre: nombre.value,
        telefono: telefono.value,
        adultos: adultos.value,
        menores: cantMenores.value || 0,
        origen: origen.value,
        pais: paisVal,
        provincia: paisVal === "Argentina" ? provincia.value : provExt.value,
        ciudad: paisVal === "Argentina" ? ciudad.value : ciudadExt.value,
        fecha: ida.value,

        traslados_internos: internos.value === "Sí" ? textoInternos.value : "No incluye",
        esperas: esperas.value === "Sí" ? horasEspera.value + " horas" : "No incluye",

        estado: "pendiente",
        fecha_creacion: new Date()
    };

    db.collection("consultas").add(data)
    .then(()=>{
        form.style.display = "none";
        mensajeFinal.style.display = "block";
    })
    .catch(()=> alert("Error al guardar"));
});
</script>

</body>
</html>
