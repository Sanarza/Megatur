<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEGATUR</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: url('https://images.unsplash.com/photo-1501785888041-af3ef285b470') no-repeat center center/cover;
}

header {
    text-align: center;
    padding: 40px 20px;
}

h1 {
    font-size: 55px;
    color: #0a4fa3;
    text-shadow: 0 2px 0 #083a78, 0 6px 12px rgba(0,0,0,0.4), 0 0 25px rgba(10,79,163,0.6);
}

h2 {
    font-size: 18px;
    background: rgba(255,255,255,0.9);
    display: inline-block;
    padding: 6px 12px;
    border-radius: 6px;
}

.container {
    max-width: 750px;
    margin: auto;
    padding: 20px;
}

.form-box {
    background: rgba(255,255,255,0.95);
    padding: 25px;
    border-radius: 12px;
}

input, select, textarea {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    border-radius: 6px;
    border: 1px solid #ccc;
}

.row {
    display: flex;
    gap: 10px;
}

button {
    background: linear-gradient(145deg, #0a4fa3, #083a78);
    color: white;
    padding: 15px;
    border: none;
    width: 100%;
    font-size: 18px;
    border-radius: 8px;
    cursor: pointer;
    box-shadow: 0 6px #062c5c, 0 10px 20px rgba(0,0,0,0.3);
}

button:active {
    transform: translateY(4px);
    box-shadow: 0 2px #062c5c;
}

.hidden { display: none; }

#mensajeFinal {
    display: none;
    text-align: center;
    margin-top: 20px;
}

#mensajeFinal button {
    background: white;
    color: #0a4fa3;
    border: 2px solid #0a4fa3;
    box-shadow: none;
}

#mensajeError {
    display: none;
    text-align: center;
    margin-top: 20px;
}

#mensajeError button {
    background: white;
    color: #0a4fa3;
    border: 2px solid #0a4fa3;
    box-shadow: none;
}

#alertaPantalla {
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.6);
    justify-content:center;
    align-items:center;
    z-index:9999;
}
</style>
</head>

<body>

<header>
<h1>MEGATUR</h1>
<h2>Traslados y Turismo Nacional e Internacional</h2>
</header>

<div class="container">
<div class="form-box">

<form id="form">

<div id="paso1">

<h3>Datos de Pasajeros</h3>

<input type="text" id="nombre" placeholder="Nombre" required>

<div class="row">
<span style="padding:12px;background:#eee;border-radius:6px;">+549</span>
<input type="tel" id="telefono" placeholder="Número sin 0 ni 15" required>
</div>

<label>Adultos</label>
<input type="number" id="adultos" required>

<label>¿Viajan Menores?</label>
<select id="menores" onchange="toggleMenores(this)">
<option>No</option>
<option>Sí</option>
</select>

<div id="menoresBox" class="hidden">
<input type="number" id="cantMenores" placeholder="Cantidad de menores">
</div>

<label>Equipaje</label>
<select id="equipaje">
<option>Mochila de mano</option>
<option>Valija 20kg</option>
<option>Sin equipaje</option>
</select>

<button type="button" onclick="siguiente()">Continuar</button>

</div>

<div id="paso2" class="hidden">

<h3>Destino del viaje</h3>

<label>Salida desde (Misiones)</label>
<input type="text" id="origen" required>

<label>Destino</label>

<select id="pais" onchange="manejarPais()" required>
<option value="">País</option>
<option value="Argentina">Argentina</option>
<option value="Brasil">Brasil</option>
<option value="Uruguay">Uruguay</option>
<option value="Paraguay">Paraguay</option>
</select>

<div id="argentinaBox" class="row hidden">
<select id="provincia" onchange="cargarCiudades()"></select>
<select id="ciudad"></select>
</div>

<div id="exteriorBox" class="hidden">
<input type="text" id="provExt" placeholder="Provincia / Estado">
<input type="text" id="ciudadExt" placeholder="Ciudad / Municipio">
</div>

<label>Fecha ida</label>
<input type="date" id="ida" required>

<label>Hora salida</label>
<input type="time" id="salida" required>

<label>¿Incluye traslados internos?</label>
<p style="font-size:13px;color:#555;">
Ej: movimientos dentro del destino como hotel → excursiones → restaurantes → eventos.
</p>

<select id="internos" onchange="toggleInternos(this)">
<option>No</option>
<option>Sí</option>
</select>

<div id="detalleInternos" class="hidden">
<textarea id="textoInternos"></textarea>
</div>

<label>¿Incluye esperas?</label>
<p style="font-size:13px;color:#555;">
Ej: el vehículo queda disponible durante varias horas o todo el día en el destino.
</p>

<select id="esperas" onchange="toggleEspera(this)">
<option>No</option>
<option>Sí</option>
</select>

<div id="esperaHoras" class="hidden">
<input type="number" id="horasEspera">
</div>

<button type="submit">Solicitar Presupuesto</button>

</div>

</form>

<div id="mensajeFinal">
<button>GRACIAS POR TU CONSULTA</button>
</div>

<div id="mensajeError">
<button id="textoError"></button>
</div>

</div>
</div>

<div id="alertaPantalla">
    <div style="background:white;padding:30px;border-radius:12px;text-align:center;max-width:350px;">
        <p id="textoAlerta"></p>
        <button onclick="cerrarAlerta()" style="background:white;color:#0a4fa3;border:2px solid #0a4fa3;">
            ACEPTAR
        </button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBMlVhTdlsJ6Idf2dmdYWi7aojkpEuGPxg",
  authDomain: "megatur-633bf.firebaseapp.com",
  projectId: "megatur-633bf"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* ====== NUEVO: PROVINCIAS + CIUDADES ====== */

const provinciasArgentina = {
 "Buenos Aires":["La Plata","Mar del Plata","Bahía Blanca"],
 "CABA":["Ciudad Autónoma de Buenos Aires"],
 "Catamarca":["San Fernando del Valle"],
 "Chaco":["Resistencia","Los Frentones"],
 "Chubut":["Trelew","Comodoro"],
 "Córdoba":["Córdoba Capital","Villa Carlos Paz"],
 "Corrientes":["Corrientes Capital"],
 "Entre Ríos":["Paraná"],
 "Formosa":["Formosa Capital"],
 "Jujuy":["San Salvador"],
 "La Pampa":["Santa Rosa"],
 "La Rioja":["La Rioja Capital"],
 "Mendoza":["Mendoza Capital"],
 "Misiones":["Posadas","Eldorado","Iguazú"],
 "Neuquén":["Neuquén Capital"],
 "Río Negro":["Bariloche"],
 "Salta":["Salta Capital"],
 "San Juan":["San Juan Capital"],
 "San Luis":["San Luis Capital"],
 "Santa Cruz":["El Calafate"],
 "Santa Fe":["Rosario"],
 "Santiago del Estero":["Santiago Capital"],
 "Tierra del Fuego":["Ushuaia"],
 "Tucumán":["San Miguel"]
};

function manejarPais(){
    if(pais.value==="Argentina"){
        argentinaBox.classList.remove("hidden");
        exteriorBox.classList.add("hidden");

        provincia.innerHTML='<option value="">Provincia</option>';
        for(let p in provinciasArgentina){
            provincia.innerHTML+=`<option value="${p}">${p}</option>`;
        }

    }else{
        argentinaBox.classList.add("hidden");
        exteriorBox.classList.remove("hidden");
    }
}

function cargarCiudades(){
    ciudad.innerHTML='<option value="">Ciudad</option>';
    let lista=provinciasArgentina[provincia.value]||[];
    lista.forEach(c=>{
        ciudad.innerHTML+=`<option value="${c}">${c}</option>`;
    });
}

/* ====== RESTO IGUAL ====== */

function toggleMenores(e){ menoresBox.classList.toggle("hidden", e.value !== "Sí"); }
function toggleEspera(e){ esperaHoras.classList.toggle("hidden", e.value !== "Sí"); }
function toggleInternos(e){ detalleInternos.classList.toggle("hidden", e.value !== "Sí"); }

function mostrarAlerta(msg){
    textoAlerta.innerText = msg;
    alertaPantalla.style.display = "flex";
}

function cerrarAlerta(){
    alertaPantalla.style.display = "none";
}

function siguiente(){
    if(menores.value === "Sí" && (!cantMenores.value || cantMenores.value <= 0)){
        mostrarAlerta("Debés indicar la cantidad de menores");
        return;
    }
    paso1.classList.add("hidden");
    paso2.classList.remove("hidden");
}

function mostrarError(msg){
    textoError.innerText = msg;
    mensajeError.style.display = "block";
    window.scrollTo(0, document.body.scrollHeight);
}

form.addEventListener("submit", function(e){
    e.preventDefault();

    if(internos.value === "Sí" && !textoInternos.value){
        mostrarAlerta("Completá los traslados internos");
        return;
    }

    if(esperas.value === "Sí" && !horasEspera.value){
        mostrarAlerta("Indicá horas de espera");
        return;
    }

    let data = {
        nombre: nombre.value,
        telefono: telefono.value,
        adultos: adultos.value,
        menores: cantMenores.value || 0,
        origen: origen.value,
        pais: pais.value,
        provincia: provincia.value || provExt.value,
        ciudad: ciudad.value || ciudadExt.value,
        fecha: ida.value,
        traslados_internos: internos.value === "Sí" ? textoInternos.value : "No incluye",
        esperas: esperas.value === "Sí" ? horasEspera.value + " horas" : "No incluye",
        estado: "pendiente",
        fecha_creacion: new Date()
    };

    db.collection("consultas").add(data)
    .then(()=>{
        form.style.display = "none";
        mensajeFinal.style.display = "block";
    })
    .catch(()=> mostrarError("Error al guardar"));
});
</script>

</body>
</html>
