<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Admin MEGATUR</title>

<style>
body {
    font-family: Arial;
    background:#f4f4f4;
    padding:20px;
}

h1 { color:#0a4fa3; }

.card {
    background:white;
    padding:15px;
    margin:10px 0;
    border-radius:8px;
}

.pagado { background:#d4edda; }

button {
    background:#0a4fa3;
    color:white;
    padding:10px;
    border:none;
    border-radius:6px;
    margin-top:10px;
}

input {
    width:100%;
    padding:8px;
    margin-top:5px;
}

/* LOGIN */
#loginBox {
    max-width:300px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
}

#panel { display:none; }
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginBox">
<h3>Ingreso Admin</h3>
<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Contraseña">
<button onclick="login()">Ingresar</button>
</div>

<!-- PANEL -->
<div id="panel">

<h1>Panel Admin - MEGATUR</h1>
<button onclick="logout()">Cerrar sesión</button>

<div id="calendario"></div>
<div id="lista"></div>

</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBMlVhTdlsJ6Idf2dmdYWi7aojkpEuGPxg",
  authDomain: "megatur-633bf.firebaseapp.com",
  projectId: "megatur-633bf"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* LOGIN */
function login(){
    firebase.auth().signInWithEmailAndPassword(email.value, password.value)
    .catch(()=>alert("Error login"));
}

function logout(){
    firebase.auth().signOut();
}

firebase.auth().onAuthStateChanged(user=>{
    if(user){
        loginBox.style.display="none";
        panel.style.display="block";
        cargarTodo(user.email);
    }else{
        loginBox.style.display="block";
        panel.style.display="none";
    }
});

/* TELEFONO */
function limpiarTelefono(tel){
    tel = tel.replace(/\D/g,'');
    if(!tel.startsWith("549")) tel="549"+tel;
    return tel;
}

/* ENVIAR */
function enviarPresupuesto(id,tel,nombre,fecha,ciudad,adultos,menores,internos,esperas,usuario){

    let precio = document.getElementById("precio_"+id).value;
    let link = document.getElementById("link_"+id).value;

    if(!precio){ alert("Ingresá el precio"); return; }

    let telefono = limpiarTelefono(tel);

    let mensaje = `Hola ${nombre}, tu viaje del ${fecha} a ${ciudad} tiene un valor de $${precio}.

${link ? "Reservá acá: "+link : ""}

Atendido por: ${usuario}`;

    window.open("https://wa.me/"+telefono+"?text="+encodeURIComponent(mensaje));

    /* GUARDAR QUIEN RESPONDIO */
    db.collection("consultas").doc(id).update({
        respondido_por: usuario,
        fecha_respuesta: new Date()
    });
}

/* PAGADO */
function marcarPagado(id,fecha,hora,ciudad,adultos,menores){

    db.collection("consultas").doc(id).update({ estado:"pagado" });

    db.collection("fechas_ocupadas").add({
        fecha, hora, ciudad,
        personas:Number(adultos)+Number(menores)
    });
}

/* CALENDARIO */
function cargarCalendario(){
    db.collection("fechas_ocupadas").get().then(s=>{
        let html="";
        s.forEach(doc=>{
            let f=doc.data().fecha;
            html+=`<div>${f}</div>`;
        });
        calendario.innerHTML=html;
    });
}

/* CONSULTAS */
function cargarTodo(usuario){

db.collection("consultas").orderBy("fecha_creacion","desc")
.onSnapshot(snapshot=>{

    let html="";

    snapshot.forEach(doc=>{
        let d=doc.data();

        html+=`
        <div class="card ${d.estado==="pagado"?"pagado":""}">
        <b>${d.nombre}</b><br>
        ${d.fecha}<br>
        Estado: ${d.estado || "pendiente"}<br>
        Respondido por: ${d.respondido_por || "-"}

        <input id="precio_${doc.id}" placeholder="Precio">
        <input id="link_${doc.id}" placeholder="Link">

        <button onclick="enviarPresupuesto('${doc.id}','${d.telefono}','${d.nombre}','${d.fecha}','${d.ciudad}','${d.adultos}','${d.menores}','${d.traslados_internos}','${d.esperas}','${usuario}')">
        ENVIAR
        </button>

        <button onclick="marcarPagado('${doc.id}','${d.fecha}','${d.hora_salida}','${d.ciudad}','${d.adultos}','${d.menores}')">
        PAGADO
        </button>
        </div>`;
    });

    lista.innerHTML=html;
    cargarCalendario();
});
}
</script>

</body>
</html>
