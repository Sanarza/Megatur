<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>MEGATUR</title>

<style>
body {
    font-family: Arial;
    padding:20px;
}

input,select,button {
    width:100%;
    padding:10px;
    margin:5px 0;
}

/* CALENDARIO */
#calendario {
    display:flex;
    flex-wrap:wrap;
    gap:5px;
    margin:10px 0;
}

.dia {
    width:40px;
    height:40px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#eee;
    border-radius:5px;
    cursor:pointer;
}

.ocupado {
    background:red;
    color:white;
    cursor:not-allowed;
}

.seleccionado {
    background:#0a4fa3;
    color:white;
}
</style>
</head>

<body>

<h2>Solicitud de Presupuesto</h2>

<form id="form">

<input type="text" id="nombre" placeholder="Nombre" required>
<input type="tel" id="telefono" placeholder="Teléfono" required>

<input type="number" id="adultos" placeholder="Adultos" required>
<input type="number" id="cantMenores" placeholder="Menores">

<input type="text" id="origen" placeholder="Origen">
<input type="text" id="ciudad" placeholder="Destino">

<label>Seleccionar fecha:</label>
<div id="calendario"></div>

<input type="hidden" id="ida">

<input type="time" id="salida" required>

<select id="internos">
<option>No</option>
<option>Sí</option>
</select>

<textarea id="textoInternos" placeholder="Detalle internos"></textarea>

<select id="esperas">
<option>No</option>
<option>Sí</option>
</select>

<input type="number" id="horasEspera" placeholder="Horas espera">

<button type="submit">Enviar</button>

</form>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBMlVhTdlsJ6Idf2dmdYWi7aojkpEuGPxg",
  authDomain: "megatur-633bf.firebaseapp.com",
  projectId: "megatur-633bf"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let fechasOcupadas = [];

/* CARGAR FECHAS */
async function cargarFechas(){
    let snap = await db.collection("fechas_ocupadas").get();

    snap.forEach(doc=>{
        fechasOcupadas.push(doc.data().fecha);
    });

    generarCalendario();
}

/* GENERAR CALENDARIO */
function generarCalendario(){

    let hoy = new Date();
    let cont = "";

    for(let i=1;i<=31;i++){

        let dia = i.toString().padStart(2,'0');
        let mes = (hoy.getMonth()+1).toString().padStart(2,'0');
        let año = hoy.getFullYear();

        let fecha = `${año}-${mes}-${dia}`;

        let ocupado = fechasOcupadas.includes(fecha);

        cont += `<div class="dia ${ocupado?'ocupado':''}" 
        onclick="${ocupado?'':`seleccionarFecha('${fecha}',this)`}">
        ${i}
        </div>`;
    }

    document.getElementById("calendario").innerHTML = cont;
}

/* SELECCIONAR */
function seleccionarFecha(fecha,el){

    document.querySelectorAll(".dia").forEach(d=>d.classList.remove("seleccionado"));

    el.classList.add("seleccionado");

    document.getElementById("ida").value = fecha;
}

/* VALIDACION FINAL */
form.addEventListener("submit", async function(e){
    e.preventDefault();

    let fecha = ida.value;
    let hora = salida.value;

    let snap = await db.collection("fechas_ocupadas")
    .where("fecha","==",fecha)
    .get();

    let reservas = [];
    snap.forEach(doc=>reservas.push(doc.data()));

    if(reservas.length >= 2){
        alert("Ya hay 2 viajes ese día");
        return;
    }

    for(let r of reservas){
        let h1 = parseInt(hora.split(":")[0]);
        let h2 = parseInt((r.hora||"00:00").split(":")[0]);

        if(Math.abs(h1-h2)<3){
            alert("Horario ocupado cercano");
            return;
        }
    }

    let data = {
        nombre: nombre.value,
        telefono: telefono.value,
        adultos: adultos.value,
        menores: cantMenores.value || 0,
        origen: origen.value,
        ciudad: ciudad.value,
        fecha: fecha,
        hora_salida: hora,
        traslados_internos: internos.value==="Sí"?textoInternos.value:"No incluye",
        esperas: esperas.value==="Sí"?horasEspera.value+" horas":"No incluye",
        estado:"pendiente",
        fecha_creacion:new Date()
    };

    db.collection("consultas").add(data);

    alert("Consulta enviada");
});

/* INIT */
cargarFechas();
</script>

</body>
</html>
