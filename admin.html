<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Admin MEGATUR</title>

<style>
body {
    font-family: Arial;
    background:#f4f4f4;
    padding:20px;
}

h1 {
    color:#0a4fa3;
}

.card {
    background:white;
    padding:15px;
    margin:10px 0;
    border-radius:8px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

button {
    background:#0a4fa3;
    color:white;
    border:none;
    padding:10px;
    border-radius:6px;
    cursor:pointer;
    margin-top:10px;
}

button:hover {
    background:#083a78;
}
</style>
</head>

<body>

<h1>Panel Admin - MEGATUR</h1>

<div id="lista"></div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBMlVhTdlsJ6Idf2dmdYWi7aojkpEuGPxg",
  authDomain: "megatur-633bf.firebaseapp.com",
  projectId: "megatur-633bf",
  storageBucket: "megatur-633bf.firebasestorage.app",
  messagingSenderId: "651078263132",
  appId: "1:651078263132:web:e52380415a19413e812199"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* FORMATEAR TELEFONO */
function limpiarTelefono(tel){
    tel = tel.replace(/\D/g,'');
    if(!tel.startsWith("549")){
        tel = "549" + tel;
    }
    return tel;
}

/* BOTON WHATSAPP MEJORADO */
function responder(tel,nombre,fecha,ciudad,adultos,menores,internos,esperas){

    let telefono = limpiarTelefono(tel);

    let mensaje = `Hola ${nombre}, Recibimos tu consulta para el viaje del ${fecha} a ${ciudad} para ${adultos} adultos y ${menores} menores.

${internos && internos !== "No incluye" ? "Incluye traslados internos: " + internos + "." : ""}
${esperas && esperas !== "No incluye" ? " Incluye esperas: " + esperas + "." : ""}

El precio final, teniendo en cuenta estos detalles, es de $......

Recordá que los valores pueden variar por inflación, por lo que te recomendamos reservar cuanto antes.`;

    let url = "https://wa.me/" + telefono + "?text=" + encodeURIComponent(mensaje);

    window.open(url, "_blank");
}

/* CARGAR CONSULTAS */
db.collection("consultas").orderBy("fecha_creacion","desc")
.onSnapshot(snapshot => {

    let html = "";

    snapshot.forEach(doc => {
        let d = doc.data();

        html += `
        <div class="card">
            <b>${d.nombre}</b><br>
            📞 ${d.telefono}<br>
            🌍 ${d.pais} - ${d.provincia} - ${d.ciudad}<br>
            📅 ${d.fecha}<br>
            👥 Adultos: ${d.adultos} | Menores: ${d.menores}<br>
            🚐 Origen: ${d.origen}<br>

            🔁 Internos: ${d.traslados_internos ? d.traslados_internos : "No incluye"}<br>
            ⏳ Esperas: ${d.esperas ? d.esperas : "No incluye"}<br>

            📌 Estado: ${d.estado}<br>

            <button onclick="responder('${d.telefono}','${d.nombre}','${d.fecha}','${d.ciudad}','${d.adultos}','${d.menores}','${d.traslados_internos}','${d.esperas}')">
                RESPONDER POR WHATSAPP
            </button>
        </div>
        `;
    });

    document.getElementById("lista").innerHTML = html;

});
</script>

</body>
</html>
