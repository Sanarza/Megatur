<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEGATUR</title>

<style>
body {
    font-family: Arial;
    background:#f4f4f4;
    padding:20px;
}

.container {
    max-width:600px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
}

input, select, textarea, button {
    width:100%;
    padding:10px;
    margin:5px 0;
}

/* CALENDARIO VISUAL */
#calendarioVisual {
    display:flex;
    flex-wrap:wrap;
    gap:5px;
    margin:10px 0;
}

.dia {
    width:40px;
    height:40px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:5px;
    cursor:pointer;
}

.libre {
    background:#eee;
}

.ocupado {
    background:red;
    color:white;
    cursor:not-allowed;
}

.seleccionado {
    background:#0a4fa3;
    color:white;
}
</style>
</head>

<body>

<div class="container">

<h2>Solicitar Presupuesto</h2>

<form id="form">

<input type="text" id="nombre" placeholder="Nombre" required>
<input type="tel" id="telefono" placeholder="Teléfono" required>

<input type="number" id="adultos" placeholder="Cantidad de adultos" required>
<input type="number" id="cantMenores" placeholder="Cantidad de menores">

<input type="text" id="origen" placeholder="Salida desde">
<input type="text" id="ciudad" placeholder="Destino">

<label>Seleccionar fecha</label>
<div id="calendarioVisual"></div>
<input type="hidden" id="ida">

<label>Hora de salida</label>
<input type="time" id="salida" required>

<label>¿Incluye traslados internos?</label>
<select id="internos">
<option>No</option>
<option>Sí</option>
</select>

<textarea id="textoInternos" placeholder="Detalle traslados internos"></textarea>

<label>¿Incluye esperas?</label>
<select id="esperas">
<option>No</option>
<option>Sí</option>
</select>

<input type="number" id="horasEspera" placeholder="Horas de espera">

<button type="submit">Enviar consulta</button>

</form>

</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBMlVhTdlsJ6Idf2dmdYWi7aojkpEuGPxg",
  authDomain: "megatur-633bf.firebaseapp.com",
  projectId: "megatur-633bf"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let fechasOcupadas = [];

/* CARGAR FECHAS OCUPADAS */
async function cargarFechas(){
    let snap = await db.collection("fechas_ocupadas").get();

    fechasOcupadas = [];

    snap.forEach(doc=>{
        fechasOcupadas.push(doc.data().fecha);
    });

    generarCalendario();
}

/* GENERAR CALENDARIO */
function generarCalendario(){

    let hoy = new Date();
    let mes = hoy.getMonth()+1;
    let año = hoy.getFullYear();

    let html = "";

    for(let i=1;i<=31;i++){

        let dia = i.toString().padStart(2,'0');
        let fecha = `${año}-${mes.toString().padStart(2,'0')}-${dia}`;

        let ocupado = fechasOcupadas.includes(fecha);

        html += `<div 
            class="dia ${ocupado ? 'ocupado' : 'libre'}"
            ${ocupado ? '' : `onclick="seleccionarFecha('${fecha}', this)"`}
        >
        ${i}
        </div>`;
    }

    document.getElementById("calendarioVisual").innerHTML = html;
}

/* SELECCIONAR FECHA */
function seleccionarFecha(fecha, elemento){

    document.querySelectorAll(".dia").forEach(d=>d.classList.remove("seleccionado"));

    elemento.classList.add("seleccionado");

    document.getElementById("ida").value = fecha;
}

/* VALIDAR Y ENVIAR */
form.addEventListener("submit", async function(e){
    e.preventDefault();

    let fecha = ida.value;
    let hora = salida.value;

    if(!fecha){
        alert("Seleccioná una fecha");
        return;
    }

    let snap = await db.collection("fechas_ocupadas")
    .where("fecha","==",fecha)
    .get();

    let reservas = [];
    snap.forEach(doc=>reservas.push(doc.data()));

    // MAXIMO 2
    if(reservas.length >= 2){
        alert("Ese día ya está completo");
        return;
    }

    // BLOQUEO HORARIO
    for(let r of reservas){
        let h1 = parseInt(hora.split(":")[0]);
        let h2 = parseInt((r.hora||"00:00").split(":")[0]);

        if(Math.abs(h1-h2)<3){
            alert("Ya hay un viaje cercano a ese horario");
            return;
        }
    }

    let data = {
        nombre: nombre.value,
        telefono: telefono.value,
        adultos: adultos.value,
        menores: cantMenores.value || 0,
        origen: origen.value,
        ciudad: ciudad.value,
        fecha: fecha,
        hora_salida: hora,
        traslados_internos: internos.value==="Sí"?textoInternos.value:"No incluye",
        esperas: esperas.value==="Sí"?horasEspera.value+" horas":"No incluye",
        estado:"pendiente",
        fecha_creacion:new Date()
    };

    db.collection("consultas").add(data);

    alert("Consulta enviada correctamente");
    location.reload();
});

/* INICIAR */
cargarFechas();
</script>

</body>
</html>
